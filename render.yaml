# Render Blueprint: public demonstration of the Blood Bank Management System on the FREE plan.
# Nothing here creates resources until the Blueprint is applied in the Render dashboard.
#
# - No disk and no database service: the SQLite demo database lives in /tmp and is REBUILT from synthetic
#   data on every start (Render Free has an ephemeral filesystem and sleeps after 15 minutes idle).
# - The real local database (bloodbank.db) and backups/ are git-ignored and never deployed.
# - Secrets: BBMS_SECRET_KEY is generated by Render; the four demo passwords are entered in the dashboard
#   (sync: false) and are never stored in this repository.
services:
  - type: web
    name: blood-bank-management-system
    runtime: python
    plan: free
    region: singapore
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.build_demo_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: APP_ENV
        value: production
      - key: BBMS_SECRET_KEY
        generateValue: true
      - key: BBMS_DEMO_MODE
        value: "true"
      - key: BBMS_DATABASE_URL
        value: sqlite:////tmp/bbms-demo.db
      # Trust X-Forwarded-Proto/For from Render's proxy (the only route to the service), so the app sees HTTPS.
      # Set as an environment variable rather than a CLI flag so no shell can glob-expand the "*".
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: BBMS_DEMO_PASSWORD_ADMIN
        sync: false
      - key: BBMS_DEMO_PASSWORD_DOCTOR
        sync: false
      - key: BBMS_DEMO_PASSWORD_STAFF
        sync: false
      - key: BBMS_DEMO_PASSWORD_PLATFORM
        sync: false
